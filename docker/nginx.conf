server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    # www.getgrobi.com → getgrobi.com (una sola dirección para buscadores y correos)
    if ($host = www.getgrobi.com) {
        return 301 https://getgrobi.com$request_uri;
    }

    # Se genera al arrancar; nunca en caché
    location = /config.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # Imágenes y estilos: una semana en caché
    location ~* \.(jpg|jpeg|png|svg|webp|ico|css)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
    }

    # Páginas: siempre la versión vigente
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
}
